<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocLink</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar">
    <div class="title-drag" id="title-drag">
      <span class="app-mark">DL</span>
      <span class="app-name">DocLink</span>
      <span id="title-context" class="title-context"></span>
    </div>
    <button type="button" class="id-chip" id="this-node" title="Click to copy your DocLink ID">
      <span class="id-kicker">ID</span>
      <span id="this-node-id">…</span>
    </button>
    <div class="win-controls" id="win-controls" hidden>
      <button type="button" data-win="minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10"><path d="M1 5h8" /></svg>
      </button>
      <button type="button" data-win="maximize" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" /></svg>
      </button>
      <button type="button" class="close" data-win="close" title="Close" aria-label="Close">
        <svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
      </button>
    </div>
  </div>

  <div class="workbench">
    <nav class="activity" aria-label="Views">
      <button type="button" class="act active" data-view="pcs" title="PCs">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button type="button" class="act" data-view="inbox" title="Incoming requests">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 8l8 6 8-6"/></svg>
        <span id="act-inbox-badge" class="act-badge" hidden>0</span>
      </button>
      <button type="button" class="act" data-view="grants" title="Granted access">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7z"/></svg>
      </button>
      <button type="button" class="act" data-view="net" title="Network — PCs discovered on the LAN">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></svg>
        <span id="act-net-badge" class="act-badge" hidden>0</span>
      </button>
    </nav>

    <aside id="side">
      <section class="side-view" data-view="pcs">
        <div class="side-head">
          <h2>PCS</h2>
          <button type="button" id="btn-add" class="tool" title="Add PC">+</button>
        </div>
        <form id="add-form" class="add-form" hidden>
          <div id="add-fields">
            <input id="add-id" placeholder="DocLink ID" autocomplete="off" spellcheck="false" required />
            <input id="add-alias" placeholder="Name (e.g. PC-Compta)" required />
            <div class="add-row">
              <select id="add-duration">
                <option value="86400">1 day</option>
                <option value="604800" selected>7 days</option>
                <option value="2592000">30 days</option>
                <option value="0">Until revoked</option>
              </select>
              <button type="submit">Next</button>
            </div>
            <details>
              <summary>Advanced</summary>
              <input id="add-host" placeholder="host:port override" />
            </details>
          </div>
          <div id="add-verify" hidden>
            <p class="dim">Verify this is really the other PC — its full fingerprint:</p>
            <code id="add-remote-fp" class="fp"></code>
            <p class="dim">This PC shows this fingerprint:</p>
            <code id="add-self-fp" class="fp"></code>
            <label class="fp-confirm">
              <input type="checkbox" id="add-fp-ok" />
              The other PC displays exactly the first fingerprint
            </label>
            <div class="add-row">
              <button type="button" id="add-back">Back</button>
              <button type="submit" id="add-confirm" disabled>Add PC</button>
            </div>
          </div>
          <p id="add-status"></p>
          <div id="add-discovered"></div>
        </form>
        <ul id="peers" class="tree"></ul>
      </section>

      <section class="side-view" data-view="inbox" hidden>
        <div class="side-head"><h2>INCOMING</h2></div>
        <ul id="requests" class="tree"></ul>
      </section>

      <section class="side-view" data-view="grants" hidden>
        <div class="side-head"><h2>GRANTED ACCESS</h2></div>
        <ul id="grants" class="tree"></ul>
      </section>

      <section class="side-view" data-view="net" hidden>
        <div class="side-head">
          <h2>NETWORK</h2>
          <label class="vis-toggle" title="Hidden PCs stay invisible to discovery but can still add others">
            <input type="checkbox" id="adv-toggle" checked />
            Visible
          </label>
        </div>
        <p class="dim net-hint">Live PCs running DocLink on this LAN.</p>
        <ul id="netlist" class="tree"></ul>
      </section>
    </aside>

    <section class="editor">
      <div class="tabs">
        <div id="tab" class="tab active">Shared files</div>
      </div>
      <div class="crumbbar" id="breadcrumb"></div>
      <div class="grid-head">
        <span>Name</span><span>Size</span><span>Modified</span><span></span>
      </div>
      <div id="listing" class="grid"></div>
      <p id="status" class="empty"></p>
    </section>
  </div>

  <footer class="statusbar">
    <span id="sb-left">Ready</span>
    <span id="sb-mid"></span>
    <span id="sb-right"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
