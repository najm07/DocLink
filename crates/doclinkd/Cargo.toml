[package]
name = "doclinkd"
description = "DocLink node daemon: publishes the local share and hosts the embedded UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
doclink-core = { path = "../doclink-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
urlencoding = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }

[target.'cfg(windows)'.dependencies]
# ShellExecuteExW "print" verb for the M3 print button. The shell types
# sit behind Win32_System_Registry in windows-0.58's feature graph.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }
