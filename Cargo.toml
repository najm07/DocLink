[workspace]
resolver = "2"
members = ["crates/doclink-core", "crates/doclinkd", "crates/doclink-win"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/najm07/doclink"

# Dependency versions are conservative baselines — run `cargo update`
# after cloning to pull the latest compatible releases.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
# rand_core feature: required for SigningKey::generate (ed25519-dalek 2.x
# gates it behind this feature; rand 0.8's OsRng satisfies the bounds).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
urlencoding = "2"
socket2 = "0.5"
# v0.3 TLS: server side + deterministic self-signed cert from the
# ed25519 identity; x509-parser extracts the SPKI key bits so clients
# can pin sha256(SPKI) == peer fingerprint.
tokio-rustls = "0.26"
# ring only: the process also pulls ring via reqwest; enabling aws-lc-rs
# too would make ServerConfig::builder() panic on the ambiguous provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
x509-parser = { version = "0.16", features = ["verify"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "service", "http1", "http2", "tokio"] }
# debug-embed: debug builds read webui/ from disk (live edits),
# release builds compile it into the binary (single-file deployment).
rust-embed = { version = "8", features = ["debug-embed"] }
wry = "0.48"
