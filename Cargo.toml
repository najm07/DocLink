[workspace]
resolver = "2"
members = ["crates/doclink-core", "crates/doclinkd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/najm07/doclink"

# Dependency versions are conservative baselines — run `cargo update`
# after cloning to pull the latest compatible releases.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"
